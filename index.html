<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2e9d8">
  <meta name="description" content="陪可愛小恐龍在荒野奔跑，跳過障礙、收集金幣，挑戰最遠距離。">
  <title>荒野衝刺｜恐龍跑酷</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="荒野衝刺首頁">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span>荒野衝刺</span>
      </a>
      <span class="edition"><span aria-hidden="true">●</span> DINO RUNNER</span>
    </header>

    <section class="game-section" aria-labelledby="gameTitle">
      <div class="game-heading">
        <div>
          <p class="eyebrow">A LITTLE RUN IN THE WILD</p>
          <h1 id="gameTitle">恐龍<span>出發！</span></h1>
        </div>
        <p class="intro">跳過仙人掌、收集金幣，跑得越遠越好。</p>
      </div>

      <div class="game-frame">
        <div class="scoreboard" aria-label="遊戲狀態">
          <div class="score-block">
            <span>距離 DIST</span>
            <strong id="score">00000</strong>
          </div>
          <span class="score-divider" aria-hidden="true"></span>
          <div class="score-block best-score">
            <span>最佳 BEST</span>
            <strong id="bestScore">00000</strong>
          </div>
          <span class="score-divider" aria-hidden="true"></span>
          <div class="life-block">
            <span>生命</span>
            <span class="life-meter" id="lifeMeter" aria-label="生命值：4 格">
              <span class="life-pip" aria-hidden="true">♥</span>
              <span class="life-pip" aria-hidden="true">♥</span>
              <span class="life-pip" aria-hidden="true">♥</span>
              <span class="life-pip" aria-hidden="true">♥</span>
            </span>
          </div>
          <div class="coin-block">
            <span class="coin-icon" aria-hidden="true">●</span>
            <span>金幣</span>
            <strong id="coinCount">00</strong>
          </div>
        </div>
        <span class="shield-status" id="shieldStatus" aria-label="護盾未啟動">護盾待機</span>

        <canvas id="gameCanvas" width="960" height="320" tabindex="0" aria-label="恐龍跑酷遊戲，按空白鍵或向上鍵跳躍"></canvas>

        <div class="game-overlay" id="gameOverlay">
          <p class="overlay-kicker" id="overlayKicker">READY, RUNNER?</p>
          <h2 id="overlayTitle">準備好了嗎？</h2>
          <p id="overlayText">陪小恐龍跑一趟荒野，躲開障礙物！</p>
          <button class="start-button" id="startButton" type="button">開始奔跑 <span aria-hidden="true">→</span></button>
        </div>
        <div class="game-caption" aria-hidden="true">
          <span>WILD RUN · EST. TODAY</span>
          <span id="gameStatus">READY</span>
        </div>
      </div>

      <div class="game-controls">
        <div class="control-hint"><kbd>SPACE</kbd><kbd>↑</kbd><span>跳躍</span></div>
        <span class="control-separator" aria-hidden="true"></span>
        <p>可以連跳兩次，撞到障礙物會扣除生命。</p>
        <button class="jump-button" id="jumpButton" type="button" aria-label="跳躍">↑</button>
      </div>
    </section>

    <footer class="footer">
      <span>RUN FAR, LITTLE DINO.</span>
      <span>金幣加分 · 護盾保護 · 小心飛鳥</span>
    </footer>
  </main>
</body>
</html>
