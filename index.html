<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2e9d8">
  <meta name="description" content="跳過仙人掌，跑得越遠越好。">
  <title>荒野衝刺</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #26382f;
      background: #f2e9d8;
      font-family: "Noto Sans TC", sans-serif;
    }

    main { width: min(900px, 100%); }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 7vw, 4rem); }
    p { color: #827b6d; }

    .game {
      position: relative;
      overflow: hidden;
      border: 1px solid #c6aa8a;
      background: #f8d7a1;
    }

    canvas { display: block; width: 100%; height: auto; }

    .score {
      position: absolute;
      top: 16px;
      right: 18px;
      font-family: monospace;
      font-size: 1.2rem;
    }

    button {
      margin-top: 16px;
      padding: 12px 20px;
      color: white;
      border: 0;
      background: #c45b3c;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #a94930; }
    button:focus-visible { outline: 3px solid #26382f; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>荒野衝刺</h1>
    <p>按空白鍵或點按鈕跳躍，避開仙人掌。</p>

    <div class="game">
      <canvas id="game" width="900" height="300" aria-label="跑酷遊戲"></canvas>
      <div class="score">距離 <span id="score">0</span></div>
    </div>

    <button id="jump" type="button">跳躍</button>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const scoreOutput = document.querySelector("#score");

    const ground = 250;
    const player = { x: 90, y: ground - 42, size: 42, velocity: 0 };
    let obstacles = [];
    let score = 0;
    let running = true;
    let lastTime = 0;
    let spawnTimer = 0;

    function jump() {
      if (!running) {
        obstacles = [];
        score = 0;
        player.y = ground - player.size;
        player.velocity = 0;
        running = true;
      }

      if (player.y >= ground - player.size) {
        player.velocity = -620;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, "#f1b877");
      sky.addColorStop(1, "#f9e6bd");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#493b35";
      ctx.fillRect(0, ground, canvas.width, canvas.height - ground);

      ctx.fillStyle = "#354d3f";
      ctx.fillRect(player.x, player.y, player.size, player.size);

      ctx.fillStyle = "#c45b3c";
      for (const obstacle of obstacles) {
        ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
      }

      if (!running) {
        ctx.fillStyle = "#26382f";
        ctx.textAlign = "center";
        ctx.font = "bold 32px sans-serif";
        ctx.fillText("遊戲結束，按按鈕重新開始", canvas.width / 2, 130);
      }
    }

    function frame(time) {
      const delta = Math.min((time - lastTime) / 1000, 0.04);
      lastTime = time;

      if (running) {
        score += delta * 10;
        scoreOutput.textContent = Math.floor(score);

        player.velocity += 1600 * delta;
        player.y += player.velocity * delta;

        if (player.y > ground - player.size) {
          player.y = ground - player.size;
          player.velocity = 0;
        }

        spawnTimer -= delta;
        if (spawnTimer <= 0) {
          obstacles.push({ x: canvas.width, y: ground - 42, width: 24, height: 42 });
          spawnTimer = 1 + Math.random() * 1.1;
        }

        for (const obstacle of obstacles) {
          obstacle.x -= 330 * delta;

          const hit = player.x < obstacle.x + obstacle.width
            && player.x + player.size > obstacle.x
            && player.y < obstacle.y + obstacle.height
            && player.y + player.size > obstacle.y;

          if (hit) running = false;
        }

        obstacles = obstacles.filter(obstacle => obstacle.x + obstacle.width > 0);
      }

      draw();
      requestAnimationFrame(frame);
    }

    document.querySelector("#jump").addEventListener("click", jump);

    document.addEventListener("keydown", event => {
      if (event.code === "Space" || event.code === "ArrowUp") {
        event.preventDefault();
        jump();
      }
    });

    requestAnimationFrame(frame);
  </script>
</body>
</html>
